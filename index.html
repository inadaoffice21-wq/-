<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTracking Pro - 工数管理・承認システム</title>
    <script>
        window.onerror = function(msg, src, lineno, colno, error) {
            setTimeout(function() {
                var el = document.getElementById('initial-loader');
                if (el) {
                    el.innerHTML = '<div style="color: #ef4444; padding: 2rem; text-align: left;"><h3>Fatal Error</h3><p>' + msg + '</p><p>Line: ' + lineno + ' - ' + src + '</p></div>';
                    el.style.display = 'block';
                }
            }, 100);
        };
        window.addEventListener("unhandledrejection", function(e) {
            setTimeout(function() {
                var el = document.getElementById('initial-loader');
                if (el) {
                    var r = e.reason ? (e.reason.message || e.reason) : 'Unknown Promise Rejection';
                    el.innerHTML = '<div style="color: #ef4444; padding: 2rem; text-align: left;"><h3>Promise Error</h3><p>' + r + '</p></div>';
                    el.style.display = 'block';
                }
            }, 100);
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-theme">
    <div id="app">
        <!-- Main content will be injected here -->
        <div class="loader-container" id="initial-loader">
            <div class="loader"></div>
            <p>Initializing...</p>
        </div>
        <noscript>
            <div style="text-align: center; padding: 2rem; color: #ef4444;">
                <p>JavaScriptを有効にしてください。また、GitHubのプレビューではなくGitHub Pagesなどで閲覧してください。</p>
            </div>
        </noscript>
    </div>

    <!-- Modals and Toasts -->
    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Combined Script -->
    <script src="app.js?v=2026031802"></script>
</body>

</html>
